<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community Library Book Request</title>
</head>

<body>

<header>
    <h1>Community Library</h1>
    <p>Request a book from our library collection.</p>
</header>

<main>
    <section>
        <h2>Book Request Form</h2>

        <form>
            <div>
                <label for="name">Full Name</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    required
                >
            </div>

            <div>
                <label for="email">Email</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    required
                >
            </div>

            <div>
                <label for="book">Book Title</label>
                <input
                    type="text"
                    id="book"
                    name="book"
                    required
                >
            </div>

            <div>
                <label for="author">Author</label>
                <input
                    type="text"
                    id="author"
                    name="author"
                >
            </div>

            <div>
                <label for="reason">Reason for Request</label>
                <textarea
                    id="reason"
                    name="reason"
                    rows="4"
                ></textarea>
            </div>

            <button type="submit">Submit Request</button>
        </form>
    </section>
</main>

<footer>
    <p>&copy; 2026 Community Library</p>
</footer>

</body>
</html>
